name: my-first-workflow
on:
  push:
    branches:
      - dev
      - feature-*
      - main
  pull_request:
    branches:
      - main
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
          
      - name: Step-2 Checkout
        uses: actions/checkout@v6.1.0
        
      - name: Step-3 Generate artifacts
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/lists.txt
          echo `hostname` >> artifacts/hostname.txt
          
      - name: Upload Single File
        uses: actions/upload-artifact@v7.0.2
        with:
          name: single-file
          path: ./myartifact.txt
          
      - name: Upload from directory
        uses: actions/upload-artifact@v7.0.2
        with:
          name: directory_artifacts
          path: artifacts/
          
      - name: Upload from Multiple paths
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple_paths
          path: |
            ./myartifact.txt
            artifacts/
            
      - name: Multiple paths with exclusions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: multiple-paths-with-exclusions
          path: |
            ./myartifact.txt
            artifacts/
            !**/hostname.txt
